<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Internal CSS Example</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: blue; /* ฟังก์ชันที่ 1: เปลี่ยนสีตัวอักษร */
        }

        p {
            background-color: lightyellow; /* ฟังก์ชันที่ 2: สีพื้นหลัง */
            padding: 10px;
        }

        .box {
            border: 2px solid red; /* ฟังก์ชันที่ 3: เส้นขอบ */
            padding: 15px;
        }
    </style>
</head>
<body>

    <h1>ตัวอย่าง Internal CSS</h1>

    <p>ย่อหน้านี้ใช้ CSS แบบภายใน</p>

    <div class="box">
        กล่องตัวอย่าง
    </div>

</body>
</html>
